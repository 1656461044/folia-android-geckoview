# Gradle 构建参数。
#
# 关于 java.io.tmpdir：
#   部分 Windows 机器的 AppData\Temp 受安全策略限制，GeckoView 的 native 资源合并
#   会在那里建临时目录时报 AccessDenied。build.ps1 会自动把 java.io.tmpdir 指到
#   工程内的 .build-tmp，所以这里不必写死路径。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true